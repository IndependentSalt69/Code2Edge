<svg viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="2560" height="1440" fill="#F4F4F4"/>

  <text x="1280" y="220" text-anchor="middle" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="30" letter-spacing="5">RETRY-CAPPED VERIFICATION</text>
  <text x="1280" y="290" text-anchor="middle" fill="#121212" font-weight="bold" font-size="72" letter-spacing="-1">Repair up to 3x. Then escalate.</text>
  <text x="1280" y="338" text-anchor="middle" fill="#505050" font-size="32">Never left to agent judgement — enforced in workflow/gates.py.</text>

  <!-- 6 dots evenly spaced, centers x: 260,672,1084,1496,1908,2320 (width covers ~2560, margins ~ (2560-6*node)/... use simple even spacing) -->
  <!-- connecting line -->
  <line x1="330" y1="640" x2="2230" y2="640" stroke="#D6D6D6" stroke-width="5"/>

  <!-- 1 Generate -->
  <circle cx="330" cy="640" r="80" fill="#121212"/>
  <path d="M300 610 h50 v20 h-15 v40 h-20 v-40 h-15 z" fill="none"/>
  <path d="M310 605 L350 605 L350 675 L310 675 Z M310 605 L335 605 L335 625 L355 625" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
  <text x="330" y="770" text-anchor="middle" fill="#121212" font-weight="bold" font-size="36">Generate</text>

  <!-- 2 Host Gate -->
  <circle cx="710" cy="640" r="80" fill="#185CEB"/>
  <path d="M675 640 l25 25 l55 -55" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="710" y="770" text-anchor="middle" fill="#185CEB" font-weight="bold" font-size="36">Host Gate</text>
  <rect x="620" y="800" width="180" height="56" rx="28" fill="#FDF0DC" stroke="#E29A3D" stroke-width="2"/>
  <text x="710" y="836" text-anchor="middle" fill="#A8620A" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="24">repair ≤ 3</text>

  <!-- 3 MCU Build -->
  <circle cx="1090" cy="640" r="80" fill="#121212"/>
  <rect x="1055" y="605" width="70" height="70" rx="6" fill="none" stroke="white" stroke-width="5"/>
  <rect x="1073" y="623" width="34" height="34" fill="none" stroke="white" stroke-width="4"/>
  <text x="1090" y="770" text-anchor="middle" fill="#121212" font-weight="bold" font-size="36">MCU Build</text>

  <!-- 4 Device Gate -->
  <circle cx="1470" cy="640" r="80" fill="#185CEB"/>
  <path d="M1435 640 l25 25 l55 -55" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1470" y="770" text-anchor="middle" fill="#185CEB" font-weight="bold" font-size="36">Device Gate</text>
  <rect x="1380" y="800" width="180" height="56" rx="28" fill="#FDF0DC" stroke="#E29A3D" stroke-width="2"/>
  <text x="1470" y="836" text-anchor="middle" fill="#A8620A" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="24">repair ≤ 3</text>

  <!-- 5 Benchmark -->
  <circle cx="1850" cy="640" r="80" fill="#121212"/>
  <circle cx="1850" cy="640" r="34" fill="none" stroke="white" stroke-width="5"/>
  <path d="M1850 618 v22 l16 16" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <text x="1850" y="770" text-anchor="middle" fill="#121212" font-weight="bold" font-size="36">Benchmark</text>

  <!-- 6 git PR -->
  <circle cx="2230" cy="640" r="80" fill="#121212"/>
  <path d="M2200 610 l50 30 l-50 30 z" fill="white"/>
  <text x="2230" y="770" text-anchor="middle" fill="#121212" font-weight="bold" font-size="36">git PR</text>

  <text x="1280" y="960" text-anchor="middle" fill="#8a8a8a" font-family="Consolas, 'Courier New', monospace" font-size="26">both gates: PASS → continue  ·  FAIL + attempt &lt; 3 → repair  ·  <tspan fill="#C62827" font-weight="bold">3 fails → escalate to human</tspan></text>

  <text x="1280" y="1280" text-anchor="middle" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="24" letter-spacing="4">CODE2EDGE</text>
</svg>
