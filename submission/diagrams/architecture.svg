<svg viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#185CEB"/>
    </marker>
  </defs>
  <rect width="2560" height="1440" fill="#F4F4F4"/>

  <text x="1280" y="150" text-anchor="middle" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="30" letter-spacing="5">SYSTEM ARCHITECTURE</text>
  <text x="1280" y="215" text-anchor="middle" fill="#121212" font-weight="bold" font-size="72" letter-spacing="-1">Three tiers, one proof chain.</text>
  <text x="1280" y="262" text-anchor="middle" fill="#505050" font-size="32">contracts/ (JSON Schema) binds every arrow below — shared, validated on every call.</text>

  <!-- rows: x from 570 to 2340 (width 1770), tags at x 230-560 -->
  <!-- Reference Layer -->
  <rect x="570" y="330" width="1770" height="110" rx="16" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="2"/>
  <text x="610" y="378" fill="#121212" font-weight="bold" font-size="34">Reference Layer</text>
  <text x="610" y="414" fill="#6b6b6b" font-family="Consolas, 'Courier New', monospace" font-size="22">reference/tiny-kws/ — frozen DS-CNN, 119,372 params, 96.65% accuracy</text>
  <line x1="1455" y1="440" x2="1455" y2="478" stroke="#185CEB" stroke-width="4" marker-end="url(#arB)"/>

  <!-- Host generation (Person A) -->
  <text x="530" y="522" text-anchor="end" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="24">PERSON A</text>
  <text x="530" y="550" text-anchor="end" fill="#8a8a8a" font-size="20">pipeline + parity</text>
  <rect x="570" y="482" width="1770" height="110" rx="16" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="2"/>
  <text x="610" y="530" fill="#121212" font-weight="bold" font-size="34">Host Generation &amp; Parity</text>
  <text x="610" y="566" fill="#6b6b6b" font-family="Consolas, 'Courier New', monospace" font-size="22">feature_extraction.c + model_data.c (int8, 168.2 KB) · run_host_parity.py</text>
  <line x1="1455" y1="592" x2="1455" y2="630" stroke="#185CEB" stroke-width="4" marker-end="url(#arB)"/>

  <!-- Gate 1 -->
  <rect x="570" y="634" width="1770" height="94" rx="14" fill="#F0FBF4" stroke="#178038" stroke-width="3"/>
  <text x="1455" y="678" text-anchor="middle" fill="#178038" font-weight="bold" font-size="30">TIER 1 — HOST PARITY GATE</text>
  <text x="1455" y="710" text-anchor="middle" fill="#4c8f63" font-size="20">blocks MCU compilation unless every stage is within tolerance</text>
  <line x1="1455" y1="728" x2="1455" y2="766" stroke="#185CEB" stroke-width="4" marker-end="url(#arB)"/>

  <!-- Firmware (Person B) -->
  <text x="530" y="810" text-anchor="end" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="24">PERSON B</text>
  <text x="530" y="838" text-anchor="end" fill="#8a8a8a" font-size="20">hardware + embedded</text>
  <rect x="570" y="770" width="1770" height="110" rx="16" fill="#FFFFFF" stroke="#E2E2E2" stroke-width="2"/>
  <text x="610" y="818" fill="#121212" font-weight="bold" font-size="34">Firmware &amp; Target Tooling</text>
  <text x="610" y="854" fill="#6b6b6b" font-family="Consolas, 'Courier New', monospace" font-size="22">Arduino/Zephyr on STM32U585 · check_target · benchmark_target · device parity</text>
  <line x1="1455" y1="880" x2="1455" y2="918" stroke="#185CEB" stroke-width="4" marker-end="url(#arB)"/>

  <!-- Gate 2 -->
  <rect x="570" y="922" width="1770" height="94" rx="14" fill="#F0FBF4" stroke="#178038" stroke-width="3"/>
  <text x="1455" y="966" text-anchor="middle" fill="#178038" font-weight="bold" font-size="30">TIER 2 — DEVICE PARITY GATE</text>
  <text x="1455" y="998" text-anchor="middle" fill="#4c8f63" font-size="20">compares physical silicon execution to golden host tensors</text>
  <line x1="1455" y1="1016" x2="1455" y2="1054" stroke="#185CEB" stroke-width="4" marker-end="url(#arB)"/>

  <!-- Bob orchestration (Person C) -->
  <text x="530" y="1098" text-anchor="end" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="24">PERSON C</text>
  <text x="530" y="1126" text-anchor="end" fill="#8a8a8a" font-size="20">Bob, MCP, integration</text>
  <rect x="570" y="1058" width="1770" height="110" rx="16" fill="#FFFFFF" stroke="#185CEB" stroke-width="2.5"/>
  <text x="610" y="1106" fill="#121212" font-weight="bold" font-size="34">Bob Orchestration</text>
  <text x="610" y="1142" fill="#6b6b6b" font-family="Consolas, 'Courier New', monospace" font-size="22">mcp_server/ — 10 MCP tools · workflow/ — retry-capped gates + human approval</text>

  <text x="1280" y="1280" text-anchor="middle" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="24" letter-spacing="4">CODE2EDGE</text>
</svg>
