<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#0F172A"/>

  <text x="800" y="55" text-anchor="middle" fill="#F8FAFC" font-size="34" font-weight="bold">Code2Edge — System Architecture</text>
  <text x="800" y="85" text-anchor="middle" fill="#94A3B8" font-size="18">reference workload → verified generation → hardware gates → Bob orchestration</text>

  <!-- Tier 1: Reference -->
  <rect x="470" y="120" width="660" height="90" rx="10" fill="rgba(37,99,235,0.10)" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="152" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="bold">Reference Layer</text>
  <text x="800" y="178" text-anchor="middle" fill="#94A3B8" font-size="15">reference/tiny-kws/ — frozen upstream DS-CNN, 119,372 params, 96.65% accuracy</text>
  <text x="1150" y="152" fill="#64748B" font-size="14">immutable</text>

  <line x1="800" y1="210" x2="800" y2="245" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tier 2: Host generation + parity (Person A) -->
  <rect x="270" y="248" width="1060" height="100" rx="10" fill="rgba(37,99,235,0.10)" stroke="#2563EB" stroke-width="2"/>
  <text x="800" y="280" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="bold">Host Generation &amp; Parity</text>
  <text x="800" y="306" text-anchor="middle" fill="#94A3B8" font-size="15">src/pipeline/feature_extraction.c + model_data.c (int8, 168.2 KB)</text>
  <text x="800" y="328" text-anchor="middle" fill="#94A3B8" font-size="15">tools/run_host_parity.py — 500-sample corpus vs. frozen reference tensors</text>
  <text x="60" y="285" fill="#60A5FA" font-size="15" font-weight="bold">Person A</text>
  <text x="60" y="305" fill="#64748B" font-size="13">pipeline + parity</text>

  <line x1="800" y1="348" x2="800" y2="383" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate 1 -->
  <rect x="530" y="386" width="540" height="66" rx="8" fill="rgba(5,150,105,0.14)" stroke="#059669" stroke-width="2.5"/>
  <text x="800" y="415" text-anchor="middle" fill="#059669" font-size="18" font-weight="bold">TIER 1 — HOST PARITY GATE</text>
  <text x="800" y="438" text-anchor="middle" fill="#94A3B8" font-size="13">blocks MCU compilation unless every stage is within tolerance</text>

  <line x1="800" y1="452" x2="800" y2="487" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tier 3: Firmware (Person B) -->
  <rect x="270" y="490" width="1060" height="100" rx="10" fill="rgba(217,153,6,0.10)" stroke="#D97706" stroke-width="2"/>
  <text x="800" y="522" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="bold">Firmware &amp; Target Tooling</text>
  <text x="800" y="548" text-anchor="middle" fill="#94A3B8" font-size="15">src/firmware/ — Arduino/Zephyr app on STM32U585 (Cortex-M33, 160 MHz)</text>
  <text x="800" y="570" text-anchor="middle" fill="#94A3B8" font-size="15">tools/target/ — check_target, benchmark_target, run_device_parity</text>
  <text x="60" y="527" fill="#F59E0B" font-size="15" font-weight="bold">Person B</text>
  <text x="60" y="547" fill="#64748B" font-size="13">hardware + embedded</text>

  <line x1="800" y1="590" x2="800" y2="625" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate 2 -->
  <rect x="530" y="628" width="540" height="66" rx="8" fill="rgba(5,150,105,0.14)" stroke="#059669" stroke-width="2.5"/>
  <text x="800" y="657" text-anchor="middle" fill="#059669" font-size="18" font-weight="bold">TIER 2 — DEVICE PARITY GATE</text>
  <text x="800" y="680" text-anchor="middle" fill="#94A3B8" font-size="13">compares physical silicon execution to golden host tensors</text>

  <line x1="800" y1="694" x2="800" y2="729" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tier 4: Bob orchestration (Person C) -->
  <rect x="270" y="732" width="1060" height="110" rx="10" fill="rgba(37,99,235,0.16)" stroke="#2563EB" stroke-width="2.5"/>
  <text x="800" y="764" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="bold">Bob Orchestration</text>
  <text x="800" y="790" text-anchor="middle" fill="#94A3B8" font-size="15">mcp_server/ — 10 MCP tools · workflow/ — retry-capped gates + human approval</text>
  <text x="800" y="812" text-anchor="middle" fill="#94A3B8" font-size="15">analysis → readiness report → approval → generate → gates → benchmark → PR</text>
  <text x="60" y="769" fill="#60A5FA" font-size="15" font-weight="bold">Person C</text>
  <text x="60" y="789" fill="#64748B" font-size="13">Bob, MCP, integration</text>

  <text x="800" y="900" text-anchor="middle" fill="#64748B" font-size="15" font-style="italic">contracts/ (JSON Schema) binds every arrow above — shared, additively versioned, validated on every call</text>
  <text x="800" y="960" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="bold">Code2Edge — Deployment with proof.</text>
</svg>
