<svg viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="2560" height="1440" fill="#161616"/>

  <text x="1280" y="220" text-anchor="middle" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="30" letter-spacing="5">THE THREE-STEP PROOF</text>

  <!-- 3 cards, width 620 gap 60, total 3*620+2*60=1980, start x=290 -->
  <g>
    <rect x="290" y="360" width="620" height="640" rx="20" fill="#1F1F1F"/>
    <rect x="290" y="360" width="8" height="640" fill="#185CEB"/>
    <circle cx="470" cy="500" r="60" fill="none" stroke="#185CEB" stroke-width="4"/>
    <path d="M450 480 l-20 20 l20 20 M490 480 l20 20 l-20 20" fill="none" stroke="#185CEB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="640" fill="#FFFFFF" font-weight="900" font-size="60" letter-spacing="-1">GENERATE</text>
    <text x="360" y="700" fill="#A7A7A7" font-size="27">C feature extractor + int8 model,</text>
    <text x="360" y="736" fill="#A7A7A7" font-size="27">from the frozen PyTorch reference.</text>
  </g>

  <g>
    <rect x="970" y="360" width="620" height="640" rx="20" fill="#1F1F1F"/>
    <rect x="970" y="360" width="8" height="640" fill="#E29A3D"/>
    <circle cx="1150" cy="500" r="60" fill="none" stroke="#E29A3D" stroke-width="4"/>
    <path d="M1150 535 v-70 M1120 495 l30 -30 l30 30" fill="none" stroke="#E29A3D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1040" y="640" fill="#FFFFFF" font-weight="900" font-size="60" letter-spacing="-1">DEPLOY</text>
    <text x="1040" y="700" fill="#A7A7A7" font-size="27">Real git branch + pull request</text>
    <text x="1040" y="736" fill="#A7A7A7" font-size="27">onto the STM32U585.</text>
  </g>

  <g>
    <rect x="1650" y="360" width="620" height="640" rx="20" fill="#1F1F1F"/>
    <rect x="1650" y="360" width="8" height="640" fill="#178038"/>
    <circle cx="1830" cy="500" r="60" fill="none" stroke="#178038" stroke-width="4"/>
    <path d="M1800 500 l20 20 l40 -45" fill="none" stroke="#178038" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1720" y="640" fill="#FFFFFF" font-weight="900" font-size="60" letter-spacing="-1">PROVE</text>
    <text x="1720" y="700" fill="#A7A7A7" font-size="27">2500/2500 stage-wise parity,</text>
    <text x="1720" y="736" fill="#A7A7A7" font-size="27">real hardware. Nothing faked.</text>
  </g>

  <text x="1280" y="1230" text-anchor="middle" fill="#185CEB" font-family="Consolas, 'Courier New', monospace" font-weight="bold" font-size="26" letter-spacing="4">CODE2EDGE</text>
</svg>
