<svg viewBox="0 0 1740 800" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1740" height="800" fill="#0F172A"/>
  <text x="850" y="55" text-anchor="middle" fill="#F8FAFC" font-size="32" font-weight="bold">Stage-Wise Differential Parity</text>
  <text x="850" y="85" text-anchor="middle" fill="#94A3B8" font-size="16">every tensor compared between the PyTorch reference and the generated C — not just final predictions</text>

  <!-- 7 nodes -->
  <g font-size="16">
    <!-- node template positions -->
    <!-- x centers roughly 130,370,610,850,1090,1330,1570 with width 200 -->
    <g id="n1">
      <rect x="70" y="260" width="200" height="120" rx="10" fill="rgba(37,99,235,0.10)" stroke="#2563EB" stroke-width="2"/>
      <text x="170" y="310" text-anchor="middle" fill="#F8FAFC">Raw PCM</text>
      <text x="170" y="332" text-anchor="middle" fill="#F8FAFC">16 kHz</text>
      <text x="170" y="360" text-anchor="middle" fill="#64748B" font-size="12">(16000,)</text>
    </g>
    <line x1="270" y1="320" x2="308" y2="320" stroke="#2563EB" stroke-width="2" marker-end="url(#pa)"/>

    <g id="n2">
      <rect x="310" y="260" width="200" height="120" rx="10" fill="rgba(37,99,235,0.10)" stroke="#2563EB" stroke-width="2"/>
      <text x="410" y="310" text-anchor="middle" fill="#F8FAFC">STFT power</text>
      <text x="410" y="332" text-anchor="middle" fill="#F8FAFC">spectrum</text>
      <text x="410" y="360" text-anchor="middle" fill="#64748B" font-size="12">(1,201,101)</text>
      <circle cx="495" cy="272" r="17" fill="#059669"/>
      <text x="495" y="278" text-anchor="middle" fill="rgb(28,28,28)" font-weight="bold">&#10003;</text>
    </g>
    <line x1="510" y1="320" x2="548" y2="320" stroke="#2563EB" stroke-width="2" marker-end="url(#pa)"/>

    <g id="n3">
      <rect x="550" y="260" width="200" height="120" rx="10" fill="rgba(37,99,235,0.10)" stroke="#2563EB" stroke-width="2"/>
      <text x="650" y="310" text-anchor="middle" fill="#F8FAFC">Mel</text>
      <text x="650" y="332" text-anchor="middle" fill="#F8FAFC">filterbank</text>
      <text x="650" y="360" text-anchor="middle" fill="#64748B" font-size="12">(1,64,101)</text>
      <circle cx="735" cy="272" r="17" fill="#059669"/>
      <text x="735" y="278" text-anchor="middle" fill="rgb(28,28,28)" font-weight="bold">&#10003;</text>
    </g>
    <line x1="750" y1="320" x2="788" y2="320" stroke="#2563EB" stroke-width="2" marker-end="url(#pa)"/>

    <g id="n4">
      <rect x="790" y="260" width="200" height="120" rx="10" fill="rgba(37,99,235,0.10)" stroke="#2563EB" stroke-width="2"/>
      <text x="890" y="310" text-anchor="middle" fill="#F8FAFC">Log</text>
      <text x="890" y="332" text-anchor="middle" fill="#F8FAFC">compression</text>
      <text x="890" y="360" text-anchor="middle" fill="#64748B" font-size="12">(1,1,64,101)</text>
      <circle cx="975" cy="272" r="17" fill="#059669"/>
      <text x="975" y="278" text-anchor="middle" fill="rgb(28,28,28)" font-weight="bold">&#10003;</text>
    </g>
    <line x1="990" y1="320" x2="1028" y2="320" stroke="#2563EB" stroke-width="2" marker-end="url(#pa)"/>

    <g id="n5">
      <rect x="1030" y="260" width="200" height="120" rx="10" fill="rgba(37,99,235,0.10)" stroke="#2563EB" stroke-width="2"/>
      <text x="1130" y="310" text-anchor="middle" fill="#F8FAFC">Normalize</text>
      <text x="1130" y="360" text-anchor="middle" fill="#64748B" font-size="12">(1,1,64,101)</text>
      <circle cx="1215" cy="272" r="17" fill="#059669"/>
      <text x="1215" y="278" text-anchor="middle" fill="rgb(28,28,28)" font-weight="bold">&#10003;</text>
    </g>
    <line x1="1230" y1="320" x2="1268" y2="320" stroke="#2563EB" stroke-width="2" marker-end="url(#pa)"/>

    <g id="n6">
      <rect x="1270" y="260" width="200" height="120" rx="10" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="2"/>
      <text x="1370" y="310" text-anchor="middle" fill="#F8FAFC">DS-CNN</text>
      <text x="1370" y="332" text-anchor="middle" fill="#F8FAFC">forward pass</text>
      <text x="1370" y="360" text-anchor="middle" fill="#64748B" font-size="12">(1,12) logits</text>
    </g>
    <line x1="1470" y1="320" x2="1508" y2="320" stroke="#2563EB" stroke-width="2" marker-end="url(#pa)"/>

    <g id="n7">
      <rect x="1510" y="260" width="190" height="120" rx="10" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="2"/>
      <text x="1605" y="310" text-anchor="middle" fill="#F8FAFC">Predicted</text>
      <text x="1605" y="332" text-anchor="middle" fill="#F8FAFC">class</text>
      <text x="1605" y="360" text-anchor="middle" fill="#64748B" font-size="12">argmax</text>
    </g>
  </g>

  <!-- host / device coverage bars -->
  <rect x="310" y="440" width="920" height="46" rx="8" fill="rgba(5,150,105,0.14)" stroke="#059669" stroke-width="2"/>
  <text x="770" y="470" text-anchor="middle" fill="#059669" font-size="16" font-weight="bold">HOST — 500 samples × 4 stages = 2500 / 2500 PASS (real)</text>

  <rect x="1270" y="440" width="430" height="46" rx="8" fill="rgba(217,153,6,0.14)" stroke="#D97706" stroke-width="2"/>
  <text x="1485" y="470" text-anchor="middle" fill="#D97706" font-size="14" font-weight="bold">DEVICE — 1 sample verified (real, thin)</text>

  <text x="850" y="560" text-anchor="middle" fill="#94A3B8" font-size="15">On divergence: report the first FAILing stage + a deterministic diagnosis hint</text>
  <text x="850" y="586" text-anchor="middle" fill="#94A3B8" font-size="14" font-style="italic">e.g. shape mismatch at framing → check hop length; constant offset after log → check epsilon</text>

  <text x="850" y="680" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="bold">Code2Edge — Deployment with proof.</text>
</svg>
